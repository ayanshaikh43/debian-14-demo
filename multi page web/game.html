<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snack Goblin — The Heist Is On</title>
<style>
:root{--ink:#241b35;--pink:#ff5c9a;--yellow:#ffe66d;--mint:#8ff0c6;--cream:#fff8e8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:linear-gradient(145deg,#b8f7e4,#e3c9ff);padding:18px;display:grid;place-items:center}
.shell{width:min(900px,100%)}header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.brand{font-size:1.25rem;font-weight:1000;letter-spacing:-.04em}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{background:var(--cream);border:3px solid var(--ink);border-radius:12px;padding:8px 12px;font-weight:900}.arena{position:relative;height:min(66vh,570px);min-height:390px;overflow:hidden;background:#fff8e8;border:4px solid var(--ink);border-radius:24px;box-shadow:8px 8px 0 var(--ink);isolation:isolate}.arena:before{content:"";position:absolute;inset:0;background:radial-gradient(#241b3518 1.5px,transparent 1.5px);background-size:22px 22px;z-index:-1}.hint{text-align:center;font-weight:800;margin:12px 0}.item{position:absolute;border:0;background:transparent;font-size:clamp(2rem,7vw,3.3rem);cursor:pointer;filter:drop-shadow(2px 3px 0 #241b3540);animation:fall linear forwards;user-select:none;touch-action:manipulation}.item:focus-visible{outline:3px dashed var(--pink)}@keyframes fall{from{transform:translateY(-70px) rotate(-15deg)}to{transform:translateY(650px) rotate(30deg)}}.toast{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) rotate(-5deg);background:var(--yellow);border:3px solid var(--ink);padding:12px 18px;border-radius:14px;font-weight:1000;font-size:1.3rem;pointer-events:none;text-align:center;box-shadow:4px 4px 0 var(--ink)}.bottom{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-top:15px}.btn{border:3px solid var(--ink);border-radius:12px;padding:10px 14px;background:var(--pink);font-weight:900;color:var(--ink);text-decoration:none;cursor:pointer}.bar{height:10px;background:#ffffff90;border:2px solid var(--ink);border-radius:99px;overflow:hidden;flex:1;min-width:120px}.fill{height:100%;width:100%;background:var(--mint);transition:width .2s}
</style></head>
<body><main class="shell">
<header><div class="brand">👺 SNACK GOBLIN</div><div class="stats"><div class="stat">🍕 Snacks: <span id="score">0</span></div><div class="stat">💥 Bonks: <span id="bonks">0</span>/3</div><div class="stat">⏱️ <span id="time">20</span>s</div></div></header>
<div class="arena" id="arena" aria-label="Game arena"><div class="toast" id="toast">CLICK THE SNACKS.<br>FEAR THE BROCCOLI.</div></div>
<div class="hint" id="hint">Tap 🍕, 🍩, 🍟 and 🍪. Do NOT tap 🥦. It has a tiny lawyer.</div>
<div class="bottom"><a class="btn" href="index.html">← Flee dramatically</a><div class="bar" aria-label="time remaining"><div class="fill" id="fill"></div></div><button class="btn" id="start">START CHAOS</button></div>
</main>
<script>
const arena=document.getElementById('arena'), scoreEl=document.getElementById('score'), bonksEl=document.getElementById('bonks'), timeEl=document.getElementById('time'), toast=document.getElementById('toast'), fill=document.getElementById('fill'), startBtn=document.getElementById('start'), hint=document.getElementById('hint');
let score=0,bonks=0,time=20,running=false,spawnTimer=null,tickTimer=null,startedAt=0;
const snacks=['🍕','🍩','🍟','🍪','🧀','🌮'], bad='🥦';
function clearItems(){arena.querySelectorAll('.item').forEach(x=>x.remove())}
function endGame(reason){if(!running)return;running=false;clearInterval(spawnTimer);clearInterval(tickTimer);clearItems();localStorage.setItem('snackGoblinScore',String(score));localStorage.setItem('snackGoblinBonks',String(bonks));localStorage.setItem('snackGoblinReason',reason);window.location.href='results.html'}
function spawn(){if(!running)return;const item=document.createElement('button');item.className='item';item.type='button';const isBad=Math.random()<.27;item.textContent=isBad?bad:snacks[Math.floor(Math.random()*snacks.length)];item.setAttribute('aria-label',isBad?'Broccoli hazard':'Snack');const maxX=Math.max(10,arena.clientWidth-65);item.style.left=Math.random()*maxX+'px';item.style.top='-60px';item.style.animationDuration=(2.5+Math.random()*1.8)+'s';item.addEventListener('click',()=>{if(!running)return;if(isBad){bonks++;bonksEl.textContent=bonks;pop('🥦 BROCCOLI BONK!');if(bonks>=3)endGame('bonked')}else{score++;scoreEl.textContent=score;pop(['NOM!','GOBLIN MODE!','CRONCH!','YOINK!'][Math.floor(Math.random()*4)])}item.remove()});item.addEventListener('animationend',()=>item.remove());arena.appendChild(item)}
let toastTimer;function pop(msg){toast.textContent=msg;toast.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>{if(running)toast.style.display='none'},650)}
function begin(){if(running)return;score=0;bonks=0;time=20;running=true;scoreEl.textContent='0';bonksEl.textContent='0';timeEl.textContent='20';fill.style.width='100%';toast.style.display='none';startBtn.disabled=true;startBtn.textContent='CHAOS IN PROGRESS';hint.textContent='Quick fingers! The broccoli has a lawyer and a tiny briefcase.';startedAt=Date.now();spawn();spawnTimer=setInterval(spawn,520);tickTimer=setInterval(()=>{time--;timeEl.textContent=time;fill.style.width=(time/20*100)+'%';if(time<=0)endGame('time')},1000)}
startBtn.addEventListener('click',begin);
</script></body></html>
